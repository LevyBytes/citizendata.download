:root { color-scheme: dark; --base: #02080b; --surface: rgba(6, 20, 25, .9); --text: #e6f1f3; --quiet: #a8bfc5; --cyan: #65e7f4; --cyan-strong: #27bed2; --gold: #d9b86a; --amber: #ffbb00; --line: rgba(111, 193, 205, .22); --line-bright: rgba(101, 231, 244, .52); --display: Orbitron, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; color: var(--text); background: var(--base); font: 16px/1.6 "Segoe UI", Arial, sans-serif; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none; background: linear-gradient(rgba(72, 167, 181, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(72, 167, 181, .05) 1px, transparent 1px); background-size: 38px 38px; mask-image: radial-gradient(ellipse at 50% 45%, black 10%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 10%, transparent 70%); }
body::after { content: ""; position: fixed; inset: 0; z-index: -3; pointer-events: none; background: radial-gradient(1px 1px at 12% 22%, rgba(230, 241, 243, .75), transparent), radial-gradient(1px 1px at 82% 16%, rgba(230, 241, 243, .6), transparent), radial-gradient(1.5px 1.5px at 66% 82%, rgba(101, 231, 244, .8), transparent), radial-gradient(1px 1px at 28% 86%, rgba(230, 241, 243, .5), transparent), radial-gradient(1.5px 1.5px at 92% 58%, rgba(217, 184, 106, .8), transparent), radial-gradient(1px 1px at 6% 64%, rgba(230, 241, 243, .55), transparent), radial-gradient(1px 1px at 44% 10%, rgba(230, 241, 243, .45), transparent), radial-gradient(circle at 50% 42%, rgba(34, 144, 159, .24), transparent 40%), radial-gradient(circle at 88% 100%, rgba(115, 93, 46, .2), transparent 36%), linear-gradient(155deg, #05151a, #02080b 54%, #061115); }
a { color: var(--cyan); text-underline-offset: .22em; }
a:hover { color: #fff; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
.topbar { position: relative; display: flex; align-items: stretch; min-height: 72px; border-bottom: 1px solid var(--line-bright); background: rgba(2, 10, 13, .94); box-shadow: 0 12px 36px rgba(0, 0, 0, .35); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px; background: linear-gradient(90deg, transparent 3%, var(--cyan-strong) 20%, transparent 52%, var(--gold) 82%, transparent 97%); opacity: .4; }
.brand { display: flex; align-items: center; gap: 13px; padding: 10px 44px 10px 24px; color: var(--text); text-decoration: none; background: linear-gradient(110deg, rgba(23, 86, 96, .32), transparent); clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%); }
.brand:hover { color: var(--text); }
.brand-emblem { width: 40px; height: 40px; flex: none; }
.brand span { display: grid; min-width: 0; }
.brand b { font: 700 15px/1.3 var(--display); letter-spacing: .12em; }
.brand small { color: var(--quiet); font: 500 11px/1.4 var(--display); letter-spacing: .1em; }
.stage { position: relative; display: grid; place-items: center; padding: clamp(2.5rem, 8vh, 5rem) 1rem; isolation: isolate; overflow: hidden; }
.radar { position: absolute; z-index: -1; left: 50%; top: 50%; width: min(40rem, 120vw); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
.radar::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, transparent 0 calc(12.5% - 1px), rgba(101, 231, 244, .09) calc(12.5% - 1px) 12.5%), linear-gradient(transparent calc(50% - .5px), rgba(101, 231, 244, .08) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)), linear-gradient(90deg, transparent calc(50% - .5px), rgba(101, 231, 244, .08) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px)); mask-image: radial-gradient(circle, black 55%, transparent 71%); -webkit-mask-image: radial-gradient(circle, black 55%, transparent 71%); }
.radar-sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(101, 231, 244, .26), rgba(101, 231, 244, .06) 14%, transparent 26%); mask-image: radial-gradient(circle, black 60%, transparent 71%); -webkit-mask-image: radial-gradient(circle, black 60%, transparent 71%); animation: turn 5s linear infinite; }
.radar-art { position: absolute; inset: 22%; width: 56%; height: 56%; color: var(--cyan); opacity: .1; animation: turn 120s linear infinite reverse; }
.blip { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 12px var(--amber); opacity: 0; animation: blip 5s ease-out infinite; }
.blip-a { left: 70%; top: 30%; animation-delay: .6s; }
.blip-b { left: 26%; top: 64%; animation-delay: 3.1s; }
.panel { position: relative; width: min(100%, 44rem); padding: clamp(2rem, 6vw, 3.75rem) clamp(1.25rem, 5vw, 3.5rem); text-align: center; background: linear-gradient(180deg, rgba(9, 29, 35, .58), rgba(4, 16, 20, .72)); border: 1px solid var(--line); box-shadow: 0 24px 64px rgba(0, 0, 0, .45), inset 0 0 90px rgba(101, 231, 244, .05); backdrop-filter: blur(3px); clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px)); }
.panel::before, .panel::after { content: ""; position: absolute; width: 34px; height: 34px; border-color: var(--cyan); border-style: solid; pointer-events: none; }
.panel::before { left: 10px; top: 10px; border-width: 2px 0 0 2px; }
.panel::after { right: 10px; bottom: 10px; border-width: 0 2px 2px 0; }
.scanlines { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(101, 231, 244, .03) 0 1px, transparent 1px 4px); }
.code { position: relative; margin: 0; font: 700 clamp(4.75rem, 20vw, 9rem)/1 var(--display); letter-spacing: .1em; padding-left: .1em; color: transparent; background: linear-gradient(180deg, #fff 6%, var(--cyan) 50%, var(--cyan-strong) 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0 24px rgba(101, 231, 244, .42)); animation: flicker 8s steps(1) infinite; }

.action { display: inline-flex; align-items: center; gap: .7rem; min-height: 48px; margin-top: 2.1rem; padding: 0 1.6rem; color: #02080b; background: linear-gradient(135deg, #ffd36a, var(--amber)); font: 700 .82rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; text-decoration: none; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); box-shadow: 0 0 26px rgba(255, 187, 0, .28); transition: filter .15s ease, transform .15s ease; }
.action:hover { color: #02080b; filter: brightness(1.08); transform: translateY(-1px); }
.action:focus-visible { clip-path: none; outline-color: var(--amber); }
.action-arrow { width: 16px; height: 16px; flex: none; }
.footer { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 2rem; padding: 1.1rem 1rem 1.4rem; border-top: 1px solid var(--line); font-size: .9rem; }
.footer a { min-height: 24px; display: inline-flex; align-items: center; color: var(--quiet); }
.footer a:hover { color: var(--cyan); }
