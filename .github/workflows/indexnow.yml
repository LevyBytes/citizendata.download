name: IndexNow

# Tells the IndexNow search engines (Bing, Yandex, Naver, Seznam and others; Google does not use IndexNow) which
# pages a push to main changed, so they recrawl them. Only page addresses are sent. The changed pages come from the
# push event itself, so the workflow checks out nothing. It starts on the events the workflow contract allows, and
# its job runs only for a push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Send the changed pages to IndexNow
        run: node --input-type=module -e "$INDEXNOW"
        env:
          KEY: d72be33c77421abd829c03bc17925ccf
          INDEXNOW: |
            import { readFileSync } from 'node:fs';
            const SITE = 'https://citizendata.download/';
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const files = new Set((event.commits ?? []).flatMap(commit => [...commit.added, ...commit.modified]));
            const urls = [...files].filter(file => /^docs\/[^/]+\.html$/.test(file)).sort()
              .map(file => SITE + (file === 'docs/index.html' ? '' : file.slice('docs/'.length)));
            if (!urls.length) { console.log('No changed pages.'); process.exit(0); }
            const key = process.env.KEY;
            const body = { host: 'citizendata.download', key: key, keyLocation: SITE + 'indexnow.txt', urlList: urls };
            console.log(JSON.stringify(body, null, 2));
            if (process.env.DRY_RUN) process.exit(0);
            // GitHub Pages publishes docs/ from main after the push; give it time before asking the engines to recrawl.
            await new Promise(resolve => setTimeout(resolve, 120000));
            const response = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(body),
            });
            console.log('IndexNow answered ' + response.status + ' ' + response.statusText);
            if (!response.ok) process.exit(1);

